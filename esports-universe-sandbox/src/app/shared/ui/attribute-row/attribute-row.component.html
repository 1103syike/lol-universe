<div class="attribute-row">
  <div class="attribute-row__main">
    <span class="attribute-row__label">{{ label() }}</span>
    <span class="attribute-row__value">{{ rating().current }}</span>
    <span class="attribute-row__stars" [attr.title]="'潛力'">{{ stars() }}</span>
    <span
      class="attribute-row__trend"
      [class.is-up]="trend() === '↑'"
      [class.is-down]="trend() === '↓'"
    >
      {{ trend() }}
    </span>
  </div>

  @if (showHidden()) {
    <div class="attribute-row__hidden">
      <span>潛力值 {{ rating().potential }}</span>
      <span>成長速度 {{ rating().growthRate }}</span>
    </div>
  }
</div>
