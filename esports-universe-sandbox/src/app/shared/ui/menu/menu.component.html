<button
  class="menu__face"
  type="button"
  [attr.aria-label]="ariaLabel() || null"
  aria-haspopup="listbox"
  [attr.aria-expanded]="isOpen()"
  [disabled]="isDisabled()"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
>
  <span class="menu__value">{{ currentLabel() }}</span>
  <svg class="menu__chevron" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M4 6.2 8 10.2 12 6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>

@if (isOpen()) {
  <div class="menu__panel" role="listbox" (keydown)="onKeydown($event)">
    @for (option of options(); track option.value; let index = $index) {
      <button
        #row
        class="menu__option"
        type="button"
        role="option"
        [class.is-on]="isSelected(option)"
        [class.is-hot]="hotIndex() === index"
        [attr.aria-selected]="isSelected(option)"
        (click)="choose(option)"
        (mouseenter)="hotIndex.set(index)"
      >
        {{ option.label }}
      </button>
    } @empty {
      <p class="menu__empty">沒有選項</p>
    }
  </div>
}
