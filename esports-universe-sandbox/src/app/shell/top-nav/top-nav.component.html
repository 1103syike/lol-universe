<header class="top-nav">
  <div class="top-nav__inner">
    <a class="brand" routerLink="/dashboard">
      <span class="brand__mark">E</span>
      <span class="brand__text">Esports Universe</span>
    </a>

    <nav class="top-nav__links" aria-label="主要導覽">
      <a class="top-nav__link top-nav__link--play" [routerLink]="playItem.path" routerLinkActive="is-active">{{ playItem.label }}</a>
      <span class="top-nav__group">
        @for (item of clubItems; track item.path) {
          <a class="top-nav__link" [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
        }
      </span>
      <span class="top-nav__group">
        @for (item of seasonItems; track item.path) {
          <a class="top-nav__link" [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
        }
      </span>
    </nav>

    <div class="universe-switcher">
      <a class="universe-switcher__label" routerLink="/universes">宇宙</a>
      @if (hasUniverses()) {
        <app-menu
          variant="nav"
          ariaLabel="宇宙"
          [value]="activeUniverseId() ?? ''"
          [options]="universeMenu()"
          (picked)="switchUniverse($event)"
        />
      } @else {
        <span class="universe-switcher__empty">尚未建立</span>
      }
    </div>
  </div>
</header>
